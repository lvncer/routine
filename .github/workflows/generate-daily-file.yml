name: Generate daily routine file

on:
  schedule:
    - cron: "0 15 * * *" # UTC 15:00 = JST 翌0:00
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD)。省略時はJSTの今日"
        required: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.generate.outputs.created }}
      date: ${{ steps.generate.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - id: generate
        run: bun run scripts/generate-daily-file.ts
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}

      - if: steps.generate.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-routine-file
          path: data/days/${{ steps.generate.outputs.date }}.md
          retention-days: 1

  # Opens a PR instead of committing straight to main so that GitHub's own
  # "pull request opened" notification email doubles as the morning alert,
  # with no extra email service or credentials needed. The PR is merged
  # immediately after, so main still gets the file with no manual step.
  open-pr:
    needs: generate
    if: needs.generate.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: ${{ needs.generate.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-routine-file
          path: data/days

      - name: Create branch and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "routine/${DATE}"
          git add "data/days/${DATE}.md"
          git commit -m "chore: add daily routine file for ${DATE}"
          git push origin "routine/${DATE}"

      - name: Open and merge pull request
        run: |
          gh pr create \
            --title "chore: routine for ${DATE}" \
            --body "Auto-generated daily routine file for ${DATE}." \
            --head "routine/${DATE}" \
            --base main
          gh pr merge "routine/${DATE}" --merge --delete-branch
